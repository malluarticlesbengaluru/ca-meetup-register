<script>
/* ===== CONFIG: change these in one place ===== */
const CONFIG={
  eventName:"Ehsaas'26",
  eventLine:"Sun 22 Nov 2026, 2 PM · Bloom Creative Zone, Haralur",
  ticketDate:"Sunday, 22 November 2026",          // shown on the ticket
  eventStartISO:"2026-11-22T14:00:00+05:30",       // backup start time for "Add to calendar" (the live time comes from Admin > Settings)
  ticketTime:"2:00 PM",                            // shown on the ticket
  ticketVenue:"Bloom Creative Zone, Haralur",  // shown on the ticket
  organiserName:"Mallu Articles Bengaluru",        // shown on the ticket
  ticketTagline:"MALAYALEE CA MEETUP · BENGALURU", // small line at the top of the ticket
  // The UPI ID, the payee name and the organisers' WhatsApp number are NOT here any more:
  // they are set in Admin > Settings > Payment details and read from the database.
  supabaseUrl:"https://jddrwajazpsdrqpwlncu.supabase.co",
  supabaseKey:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"   // publishable key: safe to be public
};
/* ===== libraries that load in the background =====
   libReady resolves (true or false) once the script tag has loaded, failed, or 20 seconds have passed. The tags set window.__sb / __qr to 1 (loaded)
   or 2 (failed), so it also works when the script finished before this code ran. */
function libReady(id,flag,up){return new Promise(res=>{
  if(up()||window[flag]===1)return res(up());
  if(window[flag]===2)return res(false);
  const el=document.getElementById(id);if(!el)return res(false);
  el.addEventListener("load",()=>res(up()));el.addEventListener("error",()=>res(false));
  setTimeout(()=>res(up()),20000)})}
const sbReady=libReady("sb-lib","__sb",()=>!!(window.supabase&&window.supabase.createClient));
const qrReady=libReady("qr-lib","__qr",()=>typeof qrcode==="function");
const whenQR=f=>typeof qrcode==="function"?f():qrReady.then(()=>{if(typeof qrcode==="function")f()});
/* `db` is a thin wrapper with only what this page uses (rpc and one storage upload). Every call waits for the Supabase library, so a tap that
   comes before it has arrived simply waits. If the library never arrives, calls answer with an error, which the page already handles. */
let sbClient=null;
async function sbGet(){
  if(!sbClient){await sbReady;
    if(window.supabase&&window.supabase.createClient){try{sbClient=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(_){}}}
  return sbClient}
const NOCLIENT={data:null,error:{message:"no client"}};
const db={
  rpc:async(...a)=>{const c=await sbGet();return c?c.rpc(...a):NOCLIENT},
  storage:{from:bucket=>({upload:async(...a)=>{const c=await sbGet();return c?c.storage.from(bucket).upload(...a):NOCLIENT}})}
};

function uuid(){if(crypto.randomUUID)return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==="x"?r:(r&3|8)).toString(16)})}
const askEmail=()=>!(S.flags&&S.flags.ask_email===false);
function blank(){return{name:"",phone:"",occ:"",occd:"",occFor:"",loc:"",food:""}}
const S={step:"home",status:null,friends:false,n:1,people:[blank()],file:null,sid:uuid(),errs:[],ferr:null,payErr:"",busy:false,result:null,
  tk:{q:"",phone:"",msg:"",busy:false,res:null,nf:false,code:"",ph:""},ti:null,cur:null,cv:[],pay:null,payLoading:false,payFail:false,payChanged:false};
const $=s=>document.querySelector(s);

/* ===== event date, time and venue: set by admins in Admin > Settings. CONFIG values are the backup if it can't be loaded ===== */

/* Home asks for the live status (spots left, price, deadline) so it can show them. It is the same read-only call the Register page makes. It never blocks Home,
   it is asked at most every 30 seconds, and it is dropped if the visitor has already moved on. */
let stAt=0;
async function loadHomeStatus(){
  if(Date.now()-stAt<30000||!await sbGet())return;
  try{const r=await Promise.race([db.rpc("get_public_status",{p_session:S.sid}),new Promise(res=>setTimeout(()=>res(null),4000))]);
    if(r&&r.data&&!r.error&&typeof r.data==="object"&&S.step==="home"){applyStatus(r.data);stAt=Date.now()}}catch(_){}
}
async function load(){
  /* speed (Nov 2026): event details and payment details are asked at the same time as the status instead of one after the other, and nothing
     waits for them unless the screen being shown needs them. If Home asked for the status less than a minute ago and registration is open,
     the form opens at once and the heartbeat (beat) re-checks it straight away. */
  loadEvent();const py=S.pay?null:loadPay();
  if(S.step==="loading"&&S.status&&S.status.accepting&&Date.now()-stAt<60000){
    S.step="form";if(S.n>maxN()){setN(maxN());S.friends=S.n>1}
    render();beat();return}
  try{
    const{data,error}=await db.rpc("get_public_status",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until)S.step="closed";
    else{if(S.step==="loading"||S.step==="closed"||S.step==="error")S.step="form";
      if(S.n>maxN()){setN(maxN());S.friends=S.n>1}}
  }catch(_){S.step="error"}
  if(py&&(S.step==="closed"||S.step==="error"))await py;   /* these two screens show the organisers' WhatsApp button */
  render();
  if(S.step==="form")beat();
}

/* ===== daily pause + 10-minute grace ===== */
let skew=0,expAt=0;
const inFill=()=>["form","summary","pay"].includes(S.step);
function applyStatus(d){S.status=d;if(d&&d.server_now)skew=new Date(d.server_now).getTime()-Date.now()}
const IST={timeZone:"Asia/Kolkata"};
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,...IST}).toUpperCase()}catch(_){return""}}
function fmtWhen(iso){try{const d=new Date(iso),day=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short",...IST});
  return fmtT(iso)+(day(d)===day(new Date(Date.now()+skew))?"":" on "+day(d))}catch(_){return""}}
function graceMs(){return S.status&&S.status.grace_until?new Date(S.status.grace_until).getTime()-(Date.now()+skew):null}
async function beat(){
  if(!inFill())return;
  try{
    const{data,error}=await db.rpc("registration_heartbeat",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until&&inFill()&&!S.busy){S.graceLost=true;S.step="closed";render()}
  }catch(_){}
  paintBar();
  checkPay();
}
function paintBar(){
  const el=$("#gbar");if(!el)return;
  const ms=graceMs();
  if(ms!=null&&ms>0&&inFill()){
    const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
    el.textContent=(S.status.closed_reason==="deadline"?"The registration deadline has passed, but you have ":"Registration has paused, but you have ")+m+":"+String(s).padStart(2,"0")+" left to finish your booking. Please pay, upload the screenshot and submit."+(S.status.reopen_at?" If you think your registration will take more than 10 minutes, please continue after "+fmtWhen(S.status.reopen_at)+" (when registration reopens).":"");
    el.hidden=false;
  }else{
    el.hidden=true;
    if(ms!=null&&ms<=0&&inFill()&&!S.busy&&Date.now()-expAt>5000){expAt=Date.now();beat()}
  }
}
setInterval(beat,30000);setInterval(paintBar,1000);

/* ===== payment details: always fresh when the Pay step opens, and re-checked every 30 seconds while it is open ===== */
async function goPay(){

}
async function checkPay(){
  if(S.step!=="pay"||S.busy||S.payLoading||S.payFail)return;
  try{
    const{data,error}=await db.rpc("get_payment_info");if(error)throw error;
    const p=payFrom(data);if(S.step!=="pay"||S.busy)return;
    const changed=p.upi!==(S.pay&&S.pay.upi)||p.payee!==(S.pay&&S.pay.payee);

    if(changed){S.payChanged=true;const y=window.scrollY;render();window.scrollTo(0,y)}
  }catch(_){}
}

/* Home behaviour: the clicks (poster zoom, the floating Register button, the optional sponsor card). The movement (reveal on scroll, countdowns,
   the floating button appearing, the count-down of the spots) is assets/home-fx.js. Torn down on every other screen. */
let homeAC=null;
const SPONSOR={src:"assets/sponsorfolder.jpg",name:"Eagles Institute of Management",logo:"assets/burg-sponsor-logo.png",video:"assets/sponsor-video.mp4"};   /* Co-sponsor. NAME and LOGO also show at the very bottom of Home ("Co-sponsored by ..."): edit them here and replace assets/sponsor-logo.png; empty strings hide that line. VIDEO plays in the co-sponsor card: put the file at assets/sponsor-video.mp4 (an MP4 with H.264 video and AAC sound plays on every phone); until the file exists the video is simply left out. Set video to "" to never show one. The sponsor card is always shown. Put the poster at this path (assets/sponsorfolder.jpg); until it exists only the poster part is left out. Put the sponsor's name in name to mention it. */
function homeUnmount(){if(homeAC){homeAC.abort();homeAC=null}}
/* a picture opens in the motion script's lightbox (it grows out of the poster); the plain zoom is the backup */
function homeMount(){
  homeUnmount();const root=document.querySelector("#app .bhome");if(!root)return;
  homeAC=new AbortController();const sig=homeAC.signal,on=(t,e,f,o)=>t&&t.addEventListener(e,f,Object.assign({signal:sig},o||{}));
  const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
  /* sections fade in as they come into view (everything just shows if the browser can't do that) */
  const rv=[].slice.call(root.querySelectorAll(".bh-rv"));
  if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("bh-in");io.unobserve(e.target)}}),{threshold:.12});rv.forEach(el=>io.observe(el));sig.addEventListener("abort",()=>io.disconnect())}
  else rv.forEach(el=>el.classList.add("bh-in"));
  /* the two countdowns: to the meetup, and (only while registration has a deadline) to the end of registration */
  const cd=[].slice.call(root.querySelectorAll("#bh-cd b")),rg=root.querySelector("#bh-reg"),rb=rg?[].slice.call(rg.querySelectorAll("b")):[],pad=n=>String(n).padStart(2,"0");
  const put=(els,s)=>[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60].forEach((n,i)=>{const x=pad(n);if(els[i]&&els[i].textContent!==x)els[i].textContent=x});
  function tick(){const now=Date.now()+(+root.dataset.skew||0),t=Date.parse(root.dataset.event);
    if(!isNaN(t))put(cd,Math.max(0,Math.floor((t-now)/1000)));
    if(rg){const c=root.dataset.close?Date.parse(root.dataset.close):NaN;if(isNaN(c)||c<=now)rg.hidden=true;else{rg.hidden=false;put(rb,Math.floor((c-now)/1000))}}}
  tick();const ti=setInterval(tick,1000);sig.addEventListener("abort",()=>clearInterval(ti));
  /* tapping a picture opens it large; Esc or a tap closes it */
  function big(src){const d=document.createElement("div");d.className="bh-lb";d.innerHTML='<img alt="">';d.firstChild.src=src;d.onclick=()=>d.remove();document.body.appendChild(d)}
  on(document,"keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".bh-lb").forEach(x=>x.remove())});
  sig.addEventListener("abort",()=>document.querySelectorAll(".bh-lb").forEach(x=>x.remove()));
  root.querySelectorAll(".bh-poster img,.bh-sl img,#home-sp-img").forEach(im=>on(im,"click",()=>big(im.currentSrc||im.src)));
  /* the photo slider: dots, swipe, and a slow auto-advance that stops on hover and when the tab is hidden */
  const tr=root.querySelector("#bh-track"),dt=[].slice.call(root.querySelectorAll("#bh-dots button")),sl=root.querySelector("#bh-slider");let cur=0,timer=null,sw=false,x0=0;
  function go(n){cur=(n+dt.length)%dt.length;tr.style.transform="translateX(-"+cur*100+"%)";dt.forEach((d,i)=>d.setAttribute("aria-current",String(i===cur)))}
  function stop(){clearInterval(timer)}function play(){stop();if(!RM&&dt.length>1)timer=setInterval(()=>go(cur+1),5000)}
  if(tr&&sl){dt.forEach((d,i)=>on(d,"click",()=>{go(i);play()}));
    on(sl,"touchstart",e=>{x0=e.touches[0].clientX;stop()},{passive:true});
    on(sl,"touchend",e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40){sw=true;go(cur+(d<0?1:-1))}play()},{passive:true});
    on(sl,"click",e=>{if(sw){e.stopPropagation();e.preventDefault();sw=false}},{capture:true});
    on(sl,"mouseenter",stop);on(sl,"mouseleave",play);on(document,"visibilitychange",()=>{document.hidden?stop():play()});play();sig.addEventListener("abort",stop)}
  /* the floating Register button: shows after the first screen, hides while the final card or the photos are in view; tapping it scrolls to the final card */
  const fab=root.querySelector("#home-fab"),watch=[].slice.call(root.querySelectorAll("#home-join,#moments,#bh-reg,#bh-grand")),vis=new Set();
  function f(){fab.classList.toggle("bh-on",scrollY>innerHeight*.8)}
  if(fab){if("IntersectionObserver" in window&&watch.length){const o2=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));fab.classList.toggle("bh-off",vis.size>0)});watch.forEach(x=>o2.observe(x));sig.addEventListener("abort",()=>o2.disconnect())}
    on(window,"scroll",f,{passive:true});f();
    on(fab,"click",()=>{const t=document.getElementById("home-join");if(t)t.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"})})}
  /* the optional sponsor video and poster: dropped quietly when the file is missing; the video pauses when scrolled out of view */
  const sv=root.querySelector("#home-sp-video");
  if(sv){const gone=()=>{const x=root.querySelector("#home-sp-vfig");if(x)x.remove()};
    on(sv,"error",gone);if(sv.error)gone();
    try{const io=new IntersectionObserver(es=>{if(!es[0].isIntersecting&&!sv.paused)sv.pause()},{threshold:.25});io.observe(sv);sig.addEventListener("abort",()=>io.disconnect())}catch(_){}}
  const sp=root.querySelector("#home-sp-img");
  if(sp){const gone=()=>{const x=root.querySelector("#home-sp-fig"),c=root.querySelector("#home-sp-cap");if(x)x.remove();if(c)c.remove()};
    on(sp,"error",gone);if(sp.complete&&sp.naturalWidth===0&&sp.getAttribute("src"))setTimeout(()=>{if(sp.naturalWidth===0&&sp.complete)gone()},0)}
}
function vAbout(){return head("About "+esc(CONFIG.organiserName),"Coming soon")+`<div class="card"><p style="margin:0">We're putting this page together. Please check back soon.</p></div><div class="row"><button class="ghost" id="go-home">Home</button></div>`}
function loadFlags(){return db.rpc("get_site_flags").then(r=>{S.flags=r.error?null:r.data}).catch(()=>{S.flags=null})}
function vError(){return head("We couldn't load this page","Please check your internet connection and try again.")+`<div class="row"><button id="retry">Try again</button><button class="ghost" id="go-home">Home</button></div>`}
function vClosed(){
  const st=S.status||{},r=st.closed_reason,re=st.reopen_at?fmtWhen(st.reopen_at):"";
  const m={not_open:["Registration hasn't opened yet","Please check back soon."],
    paused:["Registration is paused for a short while","This is a brief daily break while the organisers verify payments. "+(re?"Registration reopens at "+re+".":"Please check back soon.")],deadline:["Registration is closed","The registration deadline has passed."],full:["All spots are taken","Registration is full. Please contact the organisers if you need help."]}[r]||["Registration is closed",""];
  let h=head(m[0],esc(CONFIG.eventName)+". "+m[1]);
  if(S.graceLost&&(r==="paused"||r==="not_open"||r==="deadline"))h+=`<div class="card"><b>Your 10-minute window to finish has ended.</b><p class="note">If you have already paid, please don't pay again. Message the organisers with your payment screenshot and they will sort it out.</p>${contactBtn("Hi, I was registering for "+CONFIG.eventName+" when registration closed. I have paid Rs "+total()+" for "+S.n+" person(s). Name: "+((S.people[0]||{}).name||""),"Message the organisers")}</div>`;
  return h+`<div class="row"><button class="ghost" id="retry">Check again</button><button class="ghost" id="go-home">Home</button></div>`;
}
/* ---------- Register form (redesign Nov 2026) ---------- */
const F_ICO={user:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',group:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.2 14c2.4.1 4.3 2 4.3 4.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.1"/>',tick:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/>'};
const fSvg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${F_ICO[k]}</svg>`;
const F_CLS=["","c1","c2","c3","c4"];
const fHas=a=>!!a&&a.some(f=>Object.keys(f).length>0);
const fErr=(i,k)=>S.ferr&&S.ferr[i]&&S.ferr[i][k]?`<p class="fe" role="alert">${esc(S.ferr[i][k])}</p>`:"";
const fBad=(i,k)=>S.ferr&&S.ferr[i]&&S.ferr[i][k]?"bad":"";
function fSteps(cur){return `<ol class="fsteps" aria-label="Progress">`+["Details","Review","Payment"].map((n,j)=>`<li class="${j+1<cur?"done":j+1===cur?"cur":""}"${j+1===cur?' aria-current="step"':""}><i>${j+1<cur?"✓":j+1}</i>${n}</li>`).join("")+`</ol>`}

  return `<header class="hhead"><div class="hw"><img src="assets/burg-logo.png" alt="" width="47" height="32"><div class="hbrand"><b>${O.toUpperCase().replace(/ BENGALURU$/,"")}</b><small>BENGALURU</small></div></div><div class="fpg" id="fprog" aria-hidden="true"></div></header>`}

function fBanners(st){let h="";

function fFriends(){

    if(!p.name.trim())f.name="Please enter a name";
    if(!/^\d{10}$/.test(p.phone))f.phone="Enter a valid 10-digit phone number";

async function doSearch(){
  const T=S.tk,code=normCode(T.q),ph=String(T.phone||"").replace(/\D/g,"");T.msg="";T.res=null;T.nf=false;
  if(!/^[0-9A-F]{8}$/.test(code)||!/^\d{10}$/.test(ph)){T.nf=true;return render()}
  T.busy=true;render();let more=null;
  try{
    const{data,error}=await db.rpc("lookup_tickets",{p_code:code,p_phone:ph});if(error)throw error;
    if(data&&data.found){
      remember("mm_hist",code,10);
      T.res=data;T.code=code;T.ph=ph;
      if(data.kind==="registration"&&data.status==="paid")more=data;
    }else T.nf=true;
  }catch(_){T.msg="We couldn't reach the server. Please check your internet and try again."}
  T.busy=false;const y=window.scrollY;render();window.scrollTo(0,y);
  /* speed: the booking is already on screen; the "Your transfers" box is added when its own answer arrives */
  if(more)db.rpc("transfer_status",{p_booking_code:code,p_phone:ph}).then(x=>{
    more.xstatus=x.error||!x.data||!x.data.found?null:x.data;
    if(S.step==="tickets"&&T.res===more&&more.xstatus){const y2=window.scrollY;render();window.scrollTo(0,y2)}}).catch(()=>{});
}

async function viewTickets(){const T=S.tk;const d=T.res;if(!d)return;

async function xSell(){
  const x=S.xs;if(x.busy)return;x.err="";
  const code=normCode(x.code),ph=String(x.phone||"").replace(/\D/g,"");
  if(!/^[0-9A-F]{8}$/.test(code)||!x.ticket.trim()||!/^\d{10}$/.test(ph)||(x.mode==="public"&&!x.upi.trim())){x.err="Please fill in all the fields. The phone number must be 10 digits.";return render()}
  x.busy=true;render();
  try{
    const a={p_booking_code:code,p_ticket:x.ticket.trim(),p_phone:ph};if(x.mode==="public")a.p_upi=x.upi.trim();
    const{data,error}=await db.rpc(x.mode==="public"?"public_sell":"private_sell",a);if(error)throw error;
    if(data&&data.ok){x.res=data;S.step="xcode";x.busy=false;return render()}
    x.err=xerr(data);
  }catch(_){x.err="We couldn't reach the server. Please check your internet and try again."}
  x.busy=false;render();
}

/* wrap the message to the panel width: 44 px text, smaller if it is long (200 characters at most). Splits on spaces, and inside a word only if one word alone is too wide. Never splits an emoji. */
function msgLines(s){
  const x=document.createElement("canvas").getContext("2d"),maxW=W_MSG;let size=46;
  const wrap=z=>{x.font="700 "+z+"px "+FD;const L=[];let cur="";
    const add=w=>{const ch=Array.from(w);while(ch.length&&x.measureText(ch.join("")).width>maxW){let k=ch.length;while(k>1&&x.measureText(ch.slice(0,k).join("")).width>maxW)k--;if(cur){L.push(cur);cur=""}L.push(ch.slice(0,k).join(""));ch.splice(0,k)}
      const w2=ch.join("");if(!w2)return;const t=cur?cur+" "+w2:w2;if(x.measureText(t).width<=maxW)cur=t;else{L.push(cur);cur=w2}};
    s.split(/\s+/).filter(Boolean).forEach(add);if(cur)L.push(cur);return L};
  let L=wrap(size);while(L.length>4&&size>30){size-=4;L=wrap(size)}
  return {lines:L,size,lh:Math.round(size*1.3)}}
const W_MSG=700;

   so they are usually there before the person has typed their Booking ID. */

function ensureTicketFonts(){
  if(tfP)return tfP;
  tfP=new Promise(res=>{const l=document.createElement("link");l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Jost:wght@400;500;600&display=swap";
    l.onload=()=>res(true);l.onerror=()=>{tfP=null;res(false)};document.head.appendChild(l);setTimeout(()=>res(false),8000)})
  .then(async ok=>{try{if(document.fonts&&document.fonts.load)await Promise.all(['700 60px "Fraunces"','600 40px "Fraunces"','italic 500 30px "Fraunces"','400 30px "Jost"','500 30px "Jost"','600 30px "Jost"'].map(f=>document.fonts.load(f)))}catch(_){}return ok});
  return tfP}
async function drawTickets(){
  if(!S.ev)await loadEvent();   /* already asked for at start; only waits here if it never arrived */
  await Promise.all([loadLogo(),qrReady,ensureTicketFonts()]);
  const r=S.cur;S.cv=[];if(!r||S.step!=="ticket")return;
  const key=()=>evDate()+"|"+evTime()+"|"+evVenue(),k0=key();
  r.tickets.forEach((t,i)=>{const c=document.getElementById("tc"+i);if(c){drawTicket(c,t,r.booking_code);S.cv[i]=c}});
  /* if the organisers changed the date, time or venue meanwhile, draw again with the new details */
  loadEvent().then(()=>{if(S.step==="ticket"&&key()!==k0)drawTickets().catch(()=>{})});
}

/* ---------- downloads (JPG / PDF) ---------- */
function slug(s){return(String(s).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30))||"ticket"}
function fname(t){return "Ehsaas26-"+(t.label||"ticket")+"-"+slug(t.name)}
function jpegBlob(c){const e=document.createElement("canvas");e.width=c.width;e.height=c.height;const x=e.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,e.width,e.height);x.drawImage(c,0,0);
  return new Promise(r=>e.toBlob(r,"image/jpeg",.95))}
function saveBlob(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function makePDF(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=v=>{const b=typeof v==="string"?enc.encode(v):v;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(id+" 0 obj\n"+body+"\nendobj\n")};
  push("%PDF-1.4\n");push(new Uint8Array([37,226,227,207,211,10]));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+imgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+imgs.length+" >>");
  imgs.forEach((im,i)=>{const W=im.w/2,H=im.h/2,p=3+3*i;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p+2]=len;push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push("\nendstream\nendobj\n")});
  const total=3+3*imgs.length,xr=len;push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function pdfOf(idx){const out=[];for(const i of idx){const c=S.cv[i],b=await jpegBlob(c);out.push({w:c.width,h:c.height,bytes:new Uint8Array(await b.arrayBuffer())})}return makePDF(out)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function downloadTicket(kind,i){
  const t=S.cur.tickets[i];if(!S.cv[i])return toast("Ticket is still loading, try again");
  if(kind==="jpg")saveBlob(await jpegBlob(S.cv[i]),fname(t)+".jpg");else saveBlob(await pdfOf([i]),fname(t)+".pdf");
}
async function downloadAll(kind){
  const r=S.cur,idx=r.tickets.map((_,i)=>i);if(idx.some(i=>!S.cv[i]))return toast("Tickets are still loading, try again");
  if(kind==="pdf")saveBlob(await pdfOf(idx),"Ehsaas26-"+(r.tickets[0].label||"tickets")+"-tickets.pdf");
  else for(const i of idx){saveBlob(await jpegBlob(S.cv[i]),fname(r.tickets[i])+".jpg");await sleep(500)}
}

/* Payment QR only (the ticket QR is drawn elsewhere and is NOT changed). Error-correction level Q with a small round logo patch in the middle,
   24% of the QR's width (a circle covers less than a square of that width). Tested 26 Oct 2026 (OpenCV, ZXing, jsQR; shrunk, blurred and JPEG copies): fully readable up to about 28%, failing from 35%.
   Level H was tried and is WORSE: it makes the QR so dense that decoders start missing it. Do not make the logo bigger or switch to H without re-testing. */
const QRLOGO=new Image();QRLOGO.src="assets/logo-mark.png";
function paintLogo(c,m,k,pad){
  const x=c.getContext("2d"),s=Math.round(m*k*.24),o=Math.round((c.width-s)/2);
  x.fillStyle="#0A2147";x.beginPath();x.arc(c.width/2,c.width/2,s/2,0,Math.PI*2);x.fill();   /* a circle of diameter s */
  if(QRLOGO.naturalWidth){const lw=s*.64,lh=lw*QRLOGO.naturalHeight/QRLOGO.naturalWidth;x.drawImage(QRLOGO,o+(s-lw)/2,o+(s-lh)/2,lw,lh)}
}
function drawQR(c,text){
  const q=qrcode(0,"Q");q.addData(text);q.make();const m=q.getModuleCount(),k=8,pad=4*k;
  c.width=c.height=m*k+pad*2;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<m;r++)for(let col=0;col<m;col++)if(q.isDark(r,col))x.fillRect(pad+col*k,pad+r*k,k,k);
  paintLogo(c,m,k,pad);
  if(!QRLOGO.complete)QRLOGO.addEventListener("load",()=>paintLogo(c,m,k,pad),{once:true});
}
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200)}
const shownAmt=()=>S.step==="tpay"?S.xp.amount:total();
/* The picture people Share or Download: the payment QR drawn at its EXACT size (never scaled, so it scans as well as the one on screen),
   with the amount and payee above it and the UPI ID below it. Only this picture changes; the QR on the page does not. */
async function blobQR(){
  const q=$("#qr"),amt=shownAmt(),upi=(S.pay&&S.pay.upi)||"",payee=(S.pay&&S.pay.payee)||"";
  try{if(document.fonts&&document.fonts.load)await Promise.all(['800 40px "Manrope"','600 24px "Manrope"'].map(f=>document.fonts.load(f)))}catch(_){}
  const W=Math.max(q.width,560),side=40,FS='"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif';
  const c=document.createElement("canvas"),x=c.getContext("2d");
  function fit(t,w,size,wt){x.font=wt+" "+size+"px "+FS;while(size>14&&x.measureText(t).width>w){size-=2;x.font=wt+" "+size+"px "+FS}return size}
  const WARN="After you scan, check that the UPI ID shown in your app matches the UPI ID below.";
  x.font="600 24px "+FS;const words=WARN.split(" "),lines=[];let cur="Important:";   /* wrap the warning to the picture width */
  words.forEach(w=>{const t=cur+" "+w;if(x.measureText(t).width>W-side*2-48&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur);
  const wh=lines.length*32+36,top=payee?170:120,bottom=wh+36+150;
  c.width=W;c.height=top+q.height+bottom;
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.textAlign="center";x.textBaseline="alphabetic";
  x.fillStyle="#0A2147";let s=fit("Pay ₹"+amt,W-side*2,76,"800");x.fillText("Pay ₹"+amt,W/2,88);
  if(payee){x.fillStyle="#444";s=fit("to "+payee,W-side*2,30,"600");x.fillText("to "+payee,W/2,138)}
  x.drawImage(q,Math.round((W-q.width)/2),top);   /* 1:1, no scaling */
  let y=top+q.height+16;
  x.fillStyle="#FFF4D6";x.strokeStyle="#E0A100";x.lineWidth=3;x.beginPath();x.roundRect?x.roundRect(side,y,W-side*2,wh,14):x.rect(side,y,W-side*2,wh);x.fill();x.stroke();
  x.fillStyle="#5A3B00";x.font="700 24px "+FS;x.textAlign="center";lines.forEach((l,i)=>x.fillText(l,W/2,y+36+i*32));
  y+=wh+20;
  x.fillStyle="#666";x.font="600 24px "+FS;x.fillText("UPI ID",W/2,y+38);
  x.fillStyle="#0A2147";s=fit(upi,W-side*2,40,"800");x.fillText(upi,W/2,y+90);
  x.fillStyle="#666";x.font="600 22px "+FS;x.fillText("Scan with any UPI app",W/2,y+130);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
async function download(){const b=await blobQR(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meetup-upi-"+shownAmt()+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function compress(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{try{const k=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size?b:file)},"image/jpeg",.8)}catch(_){res(file)}};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

/* A finished booking must never leave its form data or its submission ID behind: the ID is what makes a re-tap idempotent, so reusing it would hand back the OLD booking and ignore new details. */
function resetBookingForm(){
  S.sid=uuid();S.graceLost=false;S.people=[blank()];S.n=1;S.friends=false;
  try{if(S.fileUrl)URL.revokeObjectURL(S.fileUrl)}catch(_){}
  S.file=null;S.fileUrl=null;S.errs=[];S.ferr=null;S.payErr="";S.fb=null}
async function submit(){
  if(S.busy)return;
  if(!S.file){$("#ferr").textContent="Upload your payment screenshot to continue.";return}
  S.busy=true;S.payErr="";const btn=$("#submit");btn.disabled=true;btn.textContent="Submitting…";
  try{
    const blob=await compress(S.file);
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)S.payErr="Please upload the screenshot as a JPG or PNG image.";
    else{
      const path=S.sid+"."+ext;
      const up=await db.storage.from("payment-proofs").upload(path,blob,{contentType:blob.type,upsert:false});
      if(up.error&&!/exist|duplicate|409/i.test((up.error.message||"")+(up.error.statusCode||"")))throw up.error;
      const{data,error}=await db.rpc("submit_booking",{p_submission_id:S.sid,
        p_people:S.people.map(p=>({name:p.name.trim(),phone:p.phone,occ:p.occ,occ_detail:p.occd.trim(),loc:p.loc,food:p.food})),p_screenshot_path:path});
      if(error)throw error;
      S.result=data;S.step="done";resetBookingForm();
      try{localStorage.setItem("mm_last",JSON.stringify({code:data.booking_code}))}catch(_){}
      remember("mm_mine",data.booking_code,20);
    }
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/NOT_ENOUGH_SPOTS|REGISTRATION_CLOSED/.test(m)){
      S.busy=false;S.graceLost=/REGISTRATION_CLOSED/.test(m);S.step="loading";await load();
      if(S.step==="form")S.errs=["Some spots were taken while you were registering. Please reduce the number of people, or try again later."];
      render();return}
    else if(/INVALID_/.test(m)){S.step="form";S.errs=["Some details were not accepted ("+(m.match(/INVALID_\w+/)||[""])[0]+"). Please check each field."]}
    else if(/SCREENSHOT_MISSING/.test(m))S.payErr="The screenshot did not upload. Please select it again and submit.";
    else S.payErr="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate booking. (Technical detail: "+m.slice(0,140)+")"
  }finally{S.busy=false}
  render();
}

  if(t.classList&&t.classList.contains("ph"))t.value=cleanPhone(t.value);
  if(t.id==="bq")S.tk.q=t.value;

  if(t.dataset.x)S.xb[t.dataset.x]=t.value;

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="bq"||e.target.id==="tkph")){e.preventDefault();doSearch()}if(e.key==="Enter"&&e.target.id==="xb_c"){e.preventDefault();xOpenCode()}});
/* a chip was chosen: take the red mark and message off that question */
function fClear(t){const i=+t.dataset.i,k=t.dataset.k,w=t.closest(".bad");if(S.ferr&&S.ferr[i])delete S.ferr[i][k];if(w){w.classList.remove("bad");const f=w.querySelector(".fe");if(f)f.remove()}}
/* Register form: the thin progress line in the header and the header shadow follow the scroll */
addEventListener("scroll",()=>{if(S.step!=="form")return;const p=document.getElementById("fprog");if(!p)return;
  const h=document.documentElement,m=h.scrollHeight-innerHeight;p.style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")";
  const hd=document.querySelector(".fpage .hhead");if(hd)hd.classList.toggle("sc",scrollY>8)},{passive:true});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="fr"){S.friends=t.checked;setN(t.checked?2:1);S.ferr=null;render()}
  else if(t.dataset&&t.dataset.k==="occ"){const i=+t.dataset.i,p=S.people[i];if(p.occFor!==p.occ){p.occd="";p.occFor=p.occ}
    fClear(t);if(S.ferr&&S.ferr[i])delete S.ferr[i].occd;
    const b=document.getElementById("ob"+i);if(b){b.classList.remove("bad");b.innerHTML=occBox(i,p)}}
  else if(t.dataset&&t.dataset.k&&t.type==="radio"){fClear(t)}
  else if(t.name==="cnt"){setN(+t.value);S.ferr=null;render()}
  else if(t.dataset&&t.dataset.x&&t.type==="radio"){S.xb[t.dataset.x]=t.value}
  else if(t.dataset&&t.dataset.fb==="rating"&&S.fb){S.fb.rating=+t.value}
  else if(t.id==="xf_ok"){S.xb.consent=t.checked}
  else if(t.id==="tshot"){const f=t.files[0],P=S.xp;
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){P.err="Choose an image file (a screenshot or photo).";t.value="";P.file=null;P.fileUrl=null;render()}
    else{try{if(P.fileUrl)URL.revokeObjectURL(P.fileUrl)}catch(_){}P.file=f||null;P.fileUrl=f?URL.createObjectURL(f):null;P.err="";render()}}
  else if(t.id==="shot"){const f=t.files[0];
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){$("#ferr").textContent="Choose an image file (a screenshot or photo).";t.value="";S.file=null;S.fileUrl=null}else{try{if(S.fileUrl)URL.revokeObjectURL(S.fileUrl)}catch(_){}S.file=f||null;S.fileUrl=f?URL.createObjectURL(f):null;S.payErr="";render()}}});
const HOME_GO={"bar-register":"main","hero-register":"main","go-register":"main","hero-tickets":"alt","go-tickets":"alt"};
document.addEventListener("click",async e=>{const el=e.target.closest("button,a"),id=el?el.id:"",ds=el?el.dataset:{};
  /* Home: the main button registers (or, for a returning visitor, opens their ticket); the second one does the opposite. The ids are shared with other screens, so only on Home. */
  if(S.step==="home"&&(id==="hero-register"||id==="hero-tickets"||id==="bar-register")){const jt=document.getElementById("home-join");
    if(jt){jt.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"});return}}
  if(S.step==="home"&&HOME_GO[id]){if((HOME_GO[id]==="main")!==homeRet()){S.step="loading";render();load()}else openTickets("");return}
  if(id==="go-home"){S.step="home";render();loadHomeStatus().then(()=>{if(S.step==="home")refreshHome()})}
  if(id==="go-about"){S.step="about";render()}
  if(id==="go-register"){S.step="loading";render();load()}
  if(id==="go-tickets")openTickets(S.step==="done"&&S.result?S.result.booking_code:S.step==="xdone"&&S.xb.result?S.xb.result.booking_code:"");
  if(id==="back-tickets"){S.step="tickets";render()}
  if(id==="tsearch")doSearch();
  if(id==="trefresh"){S.tk.msg="";await doSearch();toast("Status refreshed")}
  if(ds.hist){S.tk.q=ds.hist;S.tk.res=null;S.tk.nf=false;render();const ph=$("#tkph");if(ph)ph.focus()}
  if(ds.view)viewTickets();
  /* ----- transfers ----- */
  if(id==="go-xmenu"){S.step="xmenu";render();loadTI().then(()=>{if(S.step==="xmenu")render()})}
  if(ds.xstart){const d=S.tk.res;S.xs={mode:"private",code:d?d.booking_code:"",ticket:"",phone:S.tk.ph||"",upi:"",busy:false,err:"",res:null};S.step="xmenu";render()}
  if(ds.xgo){const[m,sd]=ds.xgo.split("-");if(sd==="sell"){const keep=S.xs;S.xs={mode:m,code:keep.code||"",ticket:keep.ticket||"",phone:keep.phone||"",upi:"",busy:false,err:"",res:null};S.step="xsell"}else{S.xb={code:"",busy:false,err:""};S.step="xbuy"}render()}
  if(id==="xsell")xSell();
  if(id==="copycode"){try{await navigator.clipboard.writeText(S.xs.res.code);toast("Code copied")}catch(_){toast("Press and hold the code to copy")}}
  if(id==="go-xbuy"){S.step="xbuy";render()}
  if(id==="xopen")xOpenCode();
  if(id==="xsubmit")xSubmit();
  if(id==="fbsend")fbSend();
  if(id==="copyxid"){try{await navigator.clipboard.writeText(S.xb.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(ds.xcancel&&S.tk.code){if(!confirm("Cancel this transfer code? Nobody will be able to use it."))return;
    try{const{data,error}=await db.rpc("transfer_cancel",{p_booking_code:S.tk.code,p_ticket:ds.xcancel,p_phone:S.tk.ph});if(error)throw error;
      if(data&&data.ok){toast("Code cancelled");await doSearch()}else toast(xerr(data),4500)}catch(_){toast("We couldn't reach the server. Please try again.",3500)}}
  if(ds.tpay&&S.tk.res&&S.tk.res.transfer){S.xp={code:S.tk.code,ph:S.tk.ph,amount:S.tk.res.transfer.amount_due,sid:uuid(),file:null,fileUrl:null,busy:false,err:""};S.step="tpay";S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-back"&&!S.xp.busy){S.step="tickets";render()}
  if(id==="tp-retry"){S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-submit")tPaySubmit();
  if(ds.dl)downloadTicket(ds.dl,+ds.i);
  if(id==="dl-all-pdf")downloadAll("pdf");
  if(id==="dl-all-jpg")downloadAll("jpg");
  if(id==="retry"||id==="recheck"){S.graceLost=false;S.step="loading";render();load()}
  if(id==="review"){S.errs=[];S.ferr=validate();
    if(fHas(S.ferr)){render();const f1=document.querySelector("#app .bad");if(f1){f1.scrollIntoView({behavior:"smooth",block:"center"});f1.classList.add("shake")}}
    else{S.ferr=null;S.step="summary";render()}}
  if(id==="edit"){S.step="form";S.errs=[];S.ferr=null;render()}
  if(id==="topay")goPay();
  if(id==="payretry")goPay();
  if(id==="back"&&!S.busy){S.step="summary";render()}
  if(id==="copy"){try{await navigator.clipboard.writeText(S.pay.upi);toast("UPI ID copied")}catch(_){toast("Press and hold the UPI ID to copy")}}
  if(id==="copyid"){try{await navigator.clipboard.writeText(S.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(id==="dl")download();
  if(id==="share"){const b=await blobQR(),f=new File([b],"meetup-upi-"+shownAmt()+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Pay ₹"+shownAmt()})}catch(_){}}
    else{await download();toast("Sharing isn't supported here, so the QR was downloaded")}}
  if(id==="submit")submit();
  if(id==="again"){resetBookingForm();S.result=null;S.step="loading";render();load()}
});
