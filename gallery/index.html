<style>
/* Ehsaas'26 photo page: BURGUNDY theme, the same palette and fonts as the public pages (wine, burgundy, rose, blush, cream, gold; Poppins and Lora italic).
   Look only: no ids, data attributes or Supabase calls are defined here. To tweak colours, change the first rule. */
:root{color-scheme:dark;--bg:#1A040C;--card:#3A0B1D;--ink:#F6D7C6;--mute:#CBA49B;--brand:#8C1838;--brand-d:#6E1230;--accent:#E9B24C;--line:rgba(255,179,192,.16);--line2:rgba(255,179,192,.26);
--err:#FF9A8F;--ok:#8DE5B0;--warn:#F3C766;--on:#F6D7C6;--field:rgba(26,4,12,.6);--wine:#1A040C;--deep:#4A0A1F;--burg:#8C1838;--rose:#CF736A;--blush:#FFB3C0;--cream:#F6D7C6;--gold:#E9B24C;--ember:#F08A3C;
--glass:rgba(140,24,56,.30);--glass-b:rgba(255,179,192,.22);--sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Lora",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% 0,rgba(140,24,56,.75),transparent 70%),radial-gradient(ellipse 70% 40% at 100% 55%,rgba(110,16,46,.55),transparent 70%),radial-gradient(ellipse 70% 40% at 0 85%,rgba(110,16,46,.5),transparent 70%)}
::selection{background:rgba(233,178,76,.35)}
.hdr{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(26,4,12,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-b)}
.hdr div{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}.hdr img{height:32px;width:auto;display:block}
.hdr b{font:800 .74rem/1.15 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cream)}.hdr small{display:block;font:600 .58rem/1.15 var(--sans);letter-spacing:.2em;color:var(--gold)}
main{max-width:640px;margin:0 auto;padding-top:6px}
h1{font:900 clamp(1.9rem,8.5vw,2.6rem)/1.06 var(--sans);letter-spacing:-.035em;color:var(--cream);margin:22px 0 6px}
h2{font:800 1.12rem/1.2 var(--sans);letter-spacing:-.01em;color:var(--cream);margin:0 0 6px}
.lead{font:italic 500 1.02rem/1.55 var(--serif);color:rgba(246,215,198,.88);margin:0 0 16px}
.mute{color:var(--mute)}.err{color:var(--err)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.card{background:linear-gradient(160deg,rgba(140,24,56,.42),rgba(74,10,31,.6));border:1px solid var(--glass-b);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:0 24px 50px -30px rgba(0,0,0,.8)}
.card h2{display:flex;align-items:center;gap:10px}.card h2:before{content:"";flex:none;width:5px;height:20px;border-radius:3px;background:var(--gold)}
label.l{display:block;font-weight:600;margin:14px 0 6px;color:var(--cream);font-size:.95rem}
input[type=email],input[type=password],input[type=text],input[type=tel]{width:100%;font:inherit;padding:12px 14px;min-height:50px;border:1px solid var(--line2);border-radius:14px;background:var(--field);color:var(--ink);transition:border-color .2s,box-shadow .2s}

input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,178,76,.2);outline:none}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 1000px #3A0B1D inset;caret-color:var(--ink)}
button,.btn{font:800 1rem/1.2 var(--sans);border-radius:99px;padding:14px 18px;min-height:54px;border:1.5px solid transparent;background:linear-gradient(135deg,#F3C766,var(--gold) 55%,var(--ember));color:var(--wine);box-shadow:0 10px 30px rgba(233,178,76,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;text-align:center;transition:transform .15s,box-shadow .2s}
button:active,.btn:active{transform:scale(.98)}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--blush);outline-offset:2px}
button.ghost,.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,215,198,.4);box-shadow:none}
button.danger{background:transparent;color:var(--err);border:1.5px solid rgba(255,154,143,.55);box-shadow:none}
button:disabled{opacity:1;cursor:default;box-shadow:none;background:rgba(246,215,198,.08);color:var(--mute);border:1.5px solid var(--line)}
button.sm{min-height:40px;width:auto;padding:7px 15px;font-size:.88rem}
button svg,.btn svg{width:22px;height:22px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}.who b{display:block;font:800 1.15rem/1.2 var(--sans);color:var(--cream);overflow-wrap:anywhere}
.chip{display:inline-block;font:700 .68rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--wine);background:var(--gold);border-radius:99px;padding:4px 9px;margin-top:4px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:99px;background:rgba(26,4,12,.55);border:1px solid var(--line);margin:4px 0 14px}
.seg2 button{min-height:44px;background:transparent;color:var(--mute);box-shadow:none;padding:8px}.seg2 button.on{background:linear-gradient(135deg,#F3C766,var(--gold) 55%,var(--ember));color:var(--wine)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:99px;background:rgba(26,4,12,.55);border:1px solid var(--line)}
.seg button{min-height:42px;font-size:.88rem;background:transparent;color:var(--cream);box-shadow:none;padding:6px}.seg button.on{background:linear-gradient(135deg,#F3C766,var(--gold) 55%,var(--ember));color:var(--wine)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:14;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(26,4,12,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--glass-b)}
.bar div{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.bar button{flex-direction:column;gap:3px;min-height:56px;padding:6px 4px;border-radius:16px;font:600 .72rem/1.1 var(--sans);background:transparent;color:var(--mute);box-shadow:none}
.bar button svg{width:24px;height:24px}.bar button.on{color:var(--wine);background:linear-gradient(135deg,#F3C766,var(--gold) 55%,var(--ember))}
.meter{height:12px;border-radius:99px;background:rgba(26,4,12,.6);border:1px solid var(--line);overflow:hidden;margin:8px 0;display:flex}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--blush))}.meter i.sel{background:var(--gold)}.meter.over i.sel{background:var(--err)}.meter i.low{background:var(--warn)}.meter i.full{background:var(--err)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr);gap:8px}}
.tile{position:relative;aspect-ratio:1;border:2px solid transparent;border-radius:14px;overflow:hidden;background:rgba(26,4,12,.6);cursor:pointer;display:block;padding:0;min-height:0;width:auto;box-shadow:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile .nop{display:flex;align-items:center;justify-content:center;height:100%;padding:6px;font-size:.75rem;text-align:center;color:var(--mute);word-break:break-all}
.tile .sz{position:absolute;left:5px;bottom:5px;background:rgba(26,4,12,.78);color:var(--cream);font-size:.68rem;padding:1px 7px;border-radius:8px}
.tile .mine{position:absolute;right:5px;top:5px;background:var(--gold);color:var(--wine);font-weight:700;font-size:.64rem;padding:1px 7px;border-radius:8px}
.tile input{position:absolute;left:7px;top:7px;width:26px;height:26px;margin:0;accent-color:var(--gold)}
.tile.sel{border-color:var(--gold)}.tile.bad{opacity:.5}.tile .why{position:absolute;left:0;right:0;top:38px;text-align:center;font-size:.7rem;color:#fff;background:rgba(160,40,40,.85);padding:1px 4px}
.q{display:grid;gap:8px;margin-top:10px}.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(26,4,12,.4);font-size:.92rem;align-items:center}
.it b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.it .bar2{grid-column:1/3;height:6px;border-radius:9px;background:rgba(26,4,12,.7);overflow:hidden;margin-top:4px}.it .bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ember))}
.it .acts{grid-column:1/3;display:flex;gap:8px;margin-top:4px}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:14px;text-align:center;color:var(--mute);margin-top:10px;display:none}.drop.hot{border-color:var(--gold);color:var(--gold)}
@media (hover:hover) and (pointer:fine){.drop{display:block}}
input[type=file]{display:none}.off{background:rgba(26,4,12,.6);border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:10px;color:var(--cream)}
.act{display:grid;gap:10px;margin:14px 0 6px}.act .btn{min-height:62px;font-size:1.08rem}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}.empty svg{width:46px;height:46px;color:var(--rose);margin-bottom:6px}.empty b{display:block;color:var(--cream);font-size:1.02rem}
.skel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.skel i{aspect-ratio:1;border-radius:14px;background:linear-gradient(110deg,rgba(255,179,192,.06) 30%,rgba(255,179,192,.14) 50%,rgba(255,179,192,.06) 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.skel i{animation:none}}
.banner{display:flex;gap:10px;align-items:flex-start;background:rgba(233,178,76,.14);border:1px solid rgba(233,178,76,.5);color:var(--cream);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:.93rem}
.note{font-size:.88rem;color:var(--mute)}
.lb{position:fixed;inset:0;background:#0E0207;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
.lbtop{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;color:var(--cream);font-weight:600}
.lbtop button.x{width:46px;min-height:46px;padding:0;border-radius:50%;background:rgba(246,215,198,.14);color:var(--cream);box-shadow:none;font-size:1.2rem}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:720px;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;background:#1A040C;touch-action:pan-y}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;min-height:46px;height:46px;padding:0;border-radius:50%;background:rgba(26,4,12,.7);color:var(--cream);border:1px solid var(--line2);box-shadow:none;font-size:1.5rem}
.stage .nav.l{left:2px}.stage .nav.r{right:2px}.stage .nop{color:var(--cream);padding:40px;text-align:center}
.lbinfo{color:var(--cream);text-align:center;font-size:.9rem;max-width:720px}
.lbact{width:100%;max-width:520px;display:flex;gap:10px;flex-wrap:wrap}.lbact>*{flex:1;min-width:140px}.lbact button{min-height:50px}
.lb .note{text-align:center;max-width:520px;margin:0}
</style></head><body><header class="hdr"><div><img src="../assets/burg-logo.png" alt="" width="48" height="32"><b>Ehsaas'26<small>PHOTOS</small></b></div></header><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../assets/photo-upload.js"></script>
<script>
"use strict";
/* ONE page for everyone who handles photos. Photographers sign in with their own login; attendees use Booking ID + phone, like the Tickets page.
   The page never decides limits or who sees what: the database and the "photos" Edge Function do. Numbers shown here come from the server. */
const CFG={url:"https://jddrwajazpsdrqpwlncu.supabase.co",key:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"};
const db=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
const P=window.PhotoUp,$=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LSget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
const EXT_OK={cam:["jpg","jpeg","png","heic","heif","webp","dng"],pub:["jpg","jpeg","png","heic","heif","webp"]};
const MODES={instant:["Instant","Each photo uploads as soon as you take or choose it."],check:["Check & upload","Look at your photos first, untick any, then upload."],draft:["Draft","Save photos on this phone now, upload later."]};
const VIS={own:"You can see the photos you uploaded.",photographers:"Photographers can see every photo. Attendees see their own.",all:"Everyone who is logged in can see every photo."};
const S={role:null,uid:null,isAdmin:false,name:"",code:"",phone:"",st:null,stErr:"",tab:"upload",mode:LSget("gal_mode","instant"),loginTab:"pub",msg:"",note:"",
  sel:[],q:[],drafts:[],photos:[],more:false,loading:false,lb:null,vis:"own",canDl:false,loaded:false};
if(!MODES[S.mode])S.mode="instant";
let idb=null,running=0,lastDraw=0;

/* ---------- local storage of photos (IndexedDB): instant photos are saved here first, drafts live here ---------- */
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("mm-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(_){res(null)}})}
function idbDo(mode,fn){return new Promise(res=>{if(!idb)return res(null);try{const t=idb.transaction("q",mode);let r=fn(t.objectStore("q"));t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true);t.onerror=()=>res(null);t.onabort=()=>res(null)}catch(_){res(null)}})}
const idbPut=(it,state)=>idbDo("readwrite",s=>s.put({id:it.id,owner:it.owner,file:it.file,name:it.name,size:it.size,type:it.type,lm:it.lm,state}));
const idbDel=id=>idbDo("readwrite",s=>s.delete(id));
const idbAll=()=>idbDo("readonly",s=>s.getAll()).then(r=>Array.isArray(r)?r:[]);
function persist(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}}

/* ---------- small helpers ---------- */
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={cam:svg('<path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.6"/>'),img:svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>'),
  vid:svg('<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/>'),up:svg('<path d="M12 16V5"/><path d="M7.5 9.5L12 5l4.5 4.5"/><path d="M5 19h14"/>'),swap:svg('<path d="M5 8h13"/><path d="M14.5 4.5L18 8l-3.5 3.5"/><path d="M19 16H6"/><path d="M9.5 12.5L6 16l3.5 3.5"/>'),grid:svg('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>')};
const ownerId=()=>S.role==="cam"?"cam:"+S.uid:"pub:"+S.code;
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function extOf(f){const m=/\.([a-z0-9]+)$/i.exec(f.name||"");let e=m?m[1].toLowerCase():"";if(!e){const t=(f.type||"").split("/")[1]||"";e=t==="jpeg"?"jpg":t}return e}
const fdt=s=>{try{return new Date(s).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(_){return""}};
const cfg=async()=>{let token=null;if(S.role==="cam"){const s=(await db.auth.getSession()).data.session;token=s&&s.access_token}return{url:CFG.url,key:CFG.key,token}};
const maxBytes=()=>(S.st&&S.st.max_bytes)||0;
const leftBytes=()=>Math.max(0,(S.st&&S.st.left_bytes)||0);
const usedBytes=()=>(S.st&&S.st.used_bytes)||0;
const pending=()=>S.q.filter(i=>i.state==="wait").reduce((a,i)=>a+i.size,0);
const availLeft=()=>Math.max(0,leftBytes()-pending());
function canUpload(){return S.role==="cam"?!!(S.st&&S.st.on!==false):!!(S.st&&S.st.ok)}
function uploadBlock(){
  if(canUpload())return"";
  if(S.role==="cam")return"Photo uploads are switched off right now. The admin will turn them on for the event.";
  const e=S.stErr;return e==="PHOTOS_OFF"?"Photo uploads are switched off right now. You can still view photos.":e==="NOT_PRESENT"?"Uploading opens once you have checked in at the gate. You can still view photos.":P.say(e)}
function mkItem(f){return{id:rid(),owner:ownerId(),file:f,name:f.name||"photo",size:f.size,type:f.type,lm:f.lastModified||0,state:"",p:0,err:"",on:true,bad:"",url:null}}
function checkItem(it){const e=extOf(it.file);
  if(!EXT_OK[S.role].includes(e))return"Not a photo type we can keep";
  if(!it.size)return"Empty file";
  if(maxBytes()&&it.size>maxBytes())return"Over the "+P.mb(maxBytes())+" limit for one photo";return""}
const dropUrl=it=>{if(it.url){try{URL.revokeObjectURL(it.url)}catch(_){}it.url=null}};

/* ---------- logins ---------- */
async function boot(){
  idb=await idbOpen();
  const u=new URLSearchParams(location.search);if(u.get("id")){S.loginTab="pub";S.prefill=u.get("id")}
  {const t=tokOf(u.get("to"));if(t){SH.pend=t;S.loginTab="pub";history.replaceState(null,"",location.pathname)}}
  const ses=(await db.auth.getSession()).data.session;
  if(ses){
    const q=await db.from("staff").select("name,role").eq("user_id",ses.user.id).maybeSingle();
    if(!q.error&&q.data&&(q.data.role==="camera"||q.data.role==="admin")){
      S.role="cam";S.uid=ses.user.id;S.name=q.data.name;S.isAdmin=q.data.role==="admin";
      await refreshStatus();await resume();return render();
    }
    await db.auth.signOut();
  }
  render();
}
async function loginCam(){
  const em=$("#em").value.trim(),pw=$("#pw").value;
  const r=await db.auth.signInWithPassword({email:em,password:pw});
  if(r.error){S.msg="Wrong email or password.";return render()}
  const q=await db.from("staff").select("name,role").eq("user_id",r.data.user.id).maybeSingle();
  if(q.error||!q.data||(q.data.role!=="camera"&&q.data.role!=="admin")){await db.auth.signOut();S.msg="This login is not a photographer login. Ask the admin.";return render()}
  S.msg="";S.role="cam";S.uid=r.data.user.id;S.name=q.data.name;S.isAdmin=q.data.role==="admin";
  await refreshStatus();await resume();render();
}
async function loginPub(){
  const code=($("#bid").value||"").toUpperCase().replace(/[\s-]/g,"").replace(/O/g,"0"),ph=($("#ph").value||"").replace(/\D/g,"");
  if(code.length!==8||ph.length!==10){S.msg="Enter the 8-character Booking ID and the 10-digit phone number.";return render()}
  const r=await db.rpc("photo_public_list",{p_code:code,p_phone:ph,p_before:null,p_limit:24});
  if(r.error||!r.data){S.msg="Could not check right now. Check your internet and try again.";return render()}
  if(!r.data.ok){S.msg=r.data.error==="NOT_PAID"?"This booking is not confirmed yet.":"Booking ID and phone number do not match a ticket.";return render()}
  S.msg="";S.role="pub";S.code=code;S.phone=ph;S.name="Booking "+code;S.isAdmin=false;
  const h=LSget("mm_hist",[]).filter(c=>c!==code);h.unshift(code);LSset("mm_hist",h.slice(0,12));   /* the Booking ID is remembered, the phone number never is */
  S.photos=r.data.items;S.more=r.data.items.length>=r.data.page;S.vis=r.data.visibility;S.canDl=false;S.loaded=true;
  await refreshStatus();await resume();if(SH.pend)S.tab="share";render();
}
async function signOut(){S.sel.forEach(dropUrl);if(S.role==="cam")await db.auth.signOut();
  Object.assign(S,{role:null,uid:null,isAdmin:false,st:null,stErr:"",sel:[],q:[],drafts:[],photos:[],more:false,loaded:false,lb:null,tab:"upload",phone:"",code:"",msg:"",note:""});resetVideos();resetShare();render()}
async function refreshStatus(){
  if(S.role==="cam"){const r=await db.rpc("photo_camera_status");if(!r.error&&r.data){S.st=r.data;S.stErr=""}}
  else if(S.role==="pub"){const r=await db.rpc("photo_public_status",{p_code:S.code,p_phone:S.phone});
    if(r.error||!r.data){return}

}
async function resume(){   /* photos saved on this phone by an earlier visit: queued ones continue, drafts come back */
  const own=ownerId();
  (await idbAll()).filter(x=>x.owner===own).forEach(x=>{const it=Object.assign(mkItem(x.file),{id:x.id,name:x.name,size:x.size,type:x.type,lm:x.lm});
    if(x.state==="draft"){it.state="draft";S.drafts.push(it)}else{it.state="wait";S.q.push(it)}});
  if(S.q.length){S.note="Continuing "+S.q.length+" photo"+(S.q.length>1?"s":"")+" from earlier.";pump()}

/* ---------- adding photos ---------- */
async function addFiles(list){
  S.note="";await refreshStatus();   /* other people upload too: always compare against the latest numbers */
  const have=new Set([].concat(S.sel,S.q,S.drafts).map(i=>i.name+"|"+i.size+"|"+i.lm));
  const items=[];let dup=0;
  Array.prototype.forEach.call(list,f=>{const it=mkItem(f),k=it.name+"|"+it.size+"|"+it.lm;if(have.has(k)){dup++;return}have.add(k);it.bad=checkItem(it);items.push(it)});
  const good=items.filter(i=>!i.bad),bad=items.length-good.length;
  const warn=(dup?dup+" already added, skipped. ":"")+(bad&&S.mode!=="check"?bad+" not usable (wrong type or too big), skipped. ":"");
  if(!items.length){S.note=warn;return render()}
  if(S.mode==="check"){S.sel=S.sel.concat(items);S.note=warn;S.tab="upload";return render()}
  if(S.mode==="draft"){
    if(!good.length){S.note=warn;return render()}
    persist();for(const it of good){it.state="draft";await idbPut(it,"draft");S.drafts.push(it)}S.note=warn+good.length+" saved as draft.";return render()}
  /* instant */
  if(!good.length){S.note=warn;return render()}
  const total=good.reduce((a,i)=>a+i.size,0);
  if(!canUpload()){S.note=uploadBlock()+" Switch to Draft to keep them on this phone.";return render()}
  if(total>availLeft()){S.sel=S.sel.concat(items);S.note="These do not all fit in your remaining space, so choose which ones to upload.";S.tab="upload";return render()}
  S.note=warn;await queueItems(good);render();
}
async function queueItems(items){
  for(const it of items){it.state="wait";it.p=0;it.err="";dropUrl(it);await idbPut(it,"queued");S.q.push(it)}
  pump();
}

/* ---------- the upload queue: 2 at a time ---------- */
function pump(){while(running<2){const it=S.q.find(x=>x.state==="wait");if(!it)break;running++;runOne(it).then(()=>{running--;pump()},()=>{running--;pump()})}}
async function runOne(it){
  it.state="up";it.p=0;draw();
  const who=S.role==="cam"?{kind:"camera"}:{kind:"public",code:S.code,phone:S.phone};
  const r=await P.upload(await cfg(),who,it.file,p=>{it.p=p;soft()});
  if(r.ok){it.state="done";it.p=1;idbDel(it.id);S.loaded=false}else{it.state="fail";it.err=r.message}
  await refreshStatus();draw();
}
const soft=()=>{const n=Date.now();if(n-lastDraw<200)return;lastDraw=n;drawQueue()};

/* ---------- check screen: capacity bar, tick/untick ---------- */
const selOn=()=>S.sel.filter(i=>i.on&&!i.bad);
const selBytes=()=>selOn().reduce((a,i)=>a+i.size,0);
function capHTML(sel){
  const used=usedBytes(),left=leftBytes(),total=used+left,over=sel>left,pu=total?Math.min(100,used/total*100):0,ps=total?Math.min(100-pu,sel/total*100):0;
  return `<div class="meter ${over?"over":""}"><i style="width:${pu}%"></i><i class="sel" style="width:${ps}%"></i></div>
  <div>${P.bytes(used)} used + <b>${P.bytes(sel)}</b> selected of ${P.bytes(total)} (${P.bytes(Math.max(0,left-sel))} left)</div>
  ${over?`<div class="err"><b>Over by ${P.bytes(sel-left)}.</b> Untick some photos.</div>`:""}`}

    <img src="${it.url}" alt="${esc(it.name)}" data-fb="1" loading="lazy" decoding="async"><span class="sz">${P.mb(it.size)}</span>${it.bad?`<span class="why">${esc(it.bad)}</span>`:""}</label>`}).join("");
  return `<div class="card"><h2>Check your photos</h2><div id="cap"></div>

/* the sharp preview address is short-lived (10 min), so it is kept for 8 and then asked for again */

  const mine=p.mine||S.isAdmin;
  return lbShell(SV.lb,SV.items.length,p.thumb||sharpV(p)?`<img id="vlbimg" src="${esc(sharpV(p)?p.sharp:p.thumb)}" alt="">`:`<div class="nop">No preview for this video</div>`,

/* ---------- share space (an attendee gives unused photo or video space to a friend; the database checks every rule) ---------- */
const SH={d:null,loading:false,loaded:false,fail:false,kind:"photo",f:{bid:"",ph:"",mb:""},msg:"",ok:false,busy:false,to:null,pend:null,qr:null,qrBusy:false,scan:false,scanMsg:"",pick:null};
const SHMSG={SHARING_OFF:"Sharing space is switched off right now.",FEATURE_OFF:"That feature is switched off right now.",BAD_AMOUNT:"Enter a whole number of MB, 1 or more.",
  SAME_PERSON:"That is your own booking. Enter your friend's Booking ID.",TO_NOT_FOUND:"No paid booking found with that Booking ID. Ask your friend to check their ticket.",TO_MISMATCH:"We could not find that Booking ID with that phone number. Ask your friend to check their ticket.",
  TO_NOT_PAID:"That booking is not paid yet.",TAKEN:"Your friend has already used or passed on that space, so it cannot be taken back.",ALREADY:"That was already taken back.",NOT_FOUND:"Could not find that.",CODE_INVALID:"That QR code has expired or is not valid. Ask your friend to show a new one."};
const shSay=(code,r)=>code==="TOO_MUCH"?`You only have ${P.bytes((r&&r.give_bytes)||0)} of unused space to give.`:(SHMSG[code]||P.say(code));
function resetShare(){scanStop();Object.assign(SH,{d:null,loading:false,loaded:false,fail:false,kind:"photo",f:{bid:"",ph:"",mb:""},msg:"",ok:false,busy:false,to:null,qr:null,qrBusy:false,scan:false,scanMsg:"",pick:null})}
/* ---- QR: libraries load only when needed ---- */
const loadJs=(src)=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=()=>no(new Error("load"));document.head.appendChild(e)});
const needQR=async()=>{if(!window.qrcode)await loadJs("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js")};
const needScan=async()=>{if(!window.jsQR)await loadJs("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js")};
const tokOf=t=>{t=String(t||"");try{const u=new URL(t);t=u.searchParams.get("to")||""}catch(e){}t=t.toUpperCase().replace(/[^A-Z0-9]/g,"");return/^[A-HJ-NP-Z2-9]{10}$/.test(t)?t:null};
async function shMyQR(){
  SH.qrBusy=true;SH.msg="";render();
  const r=await db.rpc("space_make_code",{p_code:S.code,p_phone:S.phone});
  SH.qrBusy=false;
  if(r.error||!r.data){SH.msg="Could not make the QR. Check your internet and try again.";SH.ok=false;return render()}
  if(!r.data.ok){SH.msg=shSay(r.data.error,r.data);SH.ok=false;return render()}
  try{await needQR();const q=qrcode(0,"M");q.addData(location.origin+location.pathname+"?to="+r.data.token);q.make();
    SH.qr={token:r.data.token,svg:q.createSvgTag({cellSize:6,margin:2,scalable:true}),exp:r.data.expires_at}}
  catch(e){SH.qr={token:r.data.token,svg:"",exp:r.data.expires_at}}
  render()}
async function shPeek(tok){
  const r=await db.rpc("space_code_peek",{p_token:tok});
  if(r.error||!r.data){SH.msg="Could not check that QR. Check your internet and try again.";SH.ok=false;return false}
  if(!r.data.ok){SH.msg=shSay(r.data.error,r.data);SH.ok=false;return false}
  SH.to={token:tok,name:r.data.name};SH.msg="";return true}
let scanStream=null,scanOn=false;
function scanStop(){scanOn=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}SH.scan=false}
async function shScan(){
  SH.scan=true;SH.scanMsg="Opening the camera…";SH.msg="";render();
  try{await needScan();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
  catch(e){const m=e&&e.message==="load"?"Could not load the scanner. Check your internet, or type the Booking ID below.":"Camera is not allowed. Allow the camera for this page, or type the Booking ID below.";scanStop();SH.msg=m;SH.ok=false;return render()}
  const v=$("#scv");if(!v){scanStop();return}
  v.srcObject=scanStream;v.setAttribute("playsinline","");await v.play().catch(()=>{});const m=$("#scm");if(m)m.textContent="Point the camera at your friend's QR";
  scanOn=true;const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  const tick=async()=>{if(!scanOn)return;
    if(v.videoWidth){const w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
      const q=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});const tok=q&&tokOf(q.data);
      if(tok){scanStop();await shPeek(tok);return render()}}
    setTimeout(tick,200)};
  tick()}
function shNeedLink(){if(!SH.pend)return;const t=SH.pend;SH.pend=null;shPeek(t).then(()=>render())}
async function loadShare(){
  if(SH.loading)return;SH.loading=true;render();
  const r=await db.rpc("space_overview",{p_code:S.code,p_phone:S.phone});
  SH.loading=false;
  if(r.error||!r.data||!r.data.ok){SH.fail=true;SH.msg="Could not load. Check your internet and try again.";SH.ok=false;return render()}
  SH.fail=false;SH.d=r.data;SH.loaded=true;render()}
function shareHTML(){
  if(SH.pend)setTimeout(shNeedLink,0);
  if(!SH.loaded&&!SH.loading&&!SH.fail)setTimeout(loadShare,0);
  const d=SH.d;
  if(!d)return `<div class="card"><h2>Share space</h2>${SH.loading?`<div class="skel"><i></i><i></i><i></i></div>`:`<p class="warn">${esc(SH.msg||"Loading…")}</p><button class="ghost" data-a="shrefresh">Try again</button>`}</div>`;
  const k=SH.kind,x=d[k],give=Math.floor((x.give_bytes||0)/1048576);
  const net=n=>n>0?`${P.bytes(n)} received from friends`:n<0?`${P.bytes(-n)} given to friends`:"none shared yet";
  const sum=(name,y)=>y.on?`<p class="note" style="margin:0 0 4px"><b style="color:var(--cream)">${name}:</b> you can give up to ${P.bytes(y.give_bytes)} (your unused space) · ${net(y.net_bytes)}</p>`:"";
  const hist=d.items.map(i=>`<div class="it"><b>${i.dir==="out"?"You gave":"You received"} ${i.mb} MB ${i.kind==="video"?"video":"photo"} space ${i.dir==="out"?"to":"from"} ${esc(i.other||"a friend")}</b><span class="note">${i.status==="returned"?"taken back":""}</span>
    <span class="note" style="grid-column:1/3">${esc(fdt(i.at))}</span>${i.can_return?`<div class="acts"><button class="ghost sm" data-sret="${i.id}">Take it back</button></div>`:""}</div>`).join("");
  return `<div class="card"><div class="top"><h2>Share space</h2><button class="ghost sm" data-a="shrefresh">Refresh</button></div>
  <p class="note" style="margin-top:0">Give some of your unused space to a friend, for example the friend with the best camera phone. You can give space for photos and for videos separately.</p>
  ${d.sharing_on?"":`<p class="warn">Sharing space is switched off right now.</p>`}
  ${sum("Photos",d.photo)}${sum("Videos",d.video)}
  <div class="seg2" style="margin-top:12px"><button class="${k==="photo"?"on":""}" data-sk="photo" ${d.photo.on?"":"disabled"}>Photo space</button><button class="${k==="video"?"on":""}" data-sk="video" ${d.video.on?"":"disabled"}>Video space</button></div>
  ${SH.to?`<p class="ok" style="margin:12px 0 0">Giving to <b>${esc(SH.to.name||"your friend")}</b> <button class="ghost sm" data-a="shclear">Change</button></p>`
  :SH.scan?`<div style="margin-top:12px"><video id="scv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video><p class="note" id="scm">Opening the camera…</p><button class="ghost" data-a="shscanstop">Stop scanning</button></div>`
  :`<button data-a="shscan" style="margin-top:12px" ${!d.sharing_on?"disabled":""}>Scan friend's QR</button><p class="note" style="margin:10px 0 0">Or type your friend's Booking ID:</p>`}
  <div ${SH.to||SH.scan?'hidden':''}>
  <label class="l" for="sbid">Your friend's Booking ID</label><input id="sbid" type="text" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="8 characters" value="${esc(SH.f.bid)}"></div>
  ${SH.pick?`<div style="margin:12px 0"><p class="note" style="margin:0 0 8px"><b style="color:var(--cream)">Who in this booking gets it?</b> (${SH.pick.mb} MB of ${SH.kind} space)</p>${SH.pick.people.map(q=>`<button class="ghost" style="display:block;width:100%;margin:6px 0;text-align:left" data-spick="${esc(q.id)}">${esc(q.name||"Guest")}</button>`).join("")}<button class="ghost sm" data-a="shpickno">Cancel</button></div>`:""}
  <label class="l" for="smb">How many MB to give (up to ${give})</label><input id="smb" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="e.g. 40" value="${esc(SH.f.mb)}">
  ${SH.msg?`<p class="${SH.ok?"ok":"err"}" role="status">${esc(SH.msg)}</p>`:""}
  <button data-a="sgive" ${SH.busy||!d.sharing_on||!x.on?"disabled":""} style="margin-top:12px">${SH.busy?"Please wait…":"Give space"}</button>
  <p class="note" style="margin-bottom:0">Your friend sees it straight away. You can take it back only while your friend has not used it.</p></div>
  <div class="card"><h2>Receive space</h2><p class="note" style="margin-top:0">Want space from friends? Show this QR. They scan it, nobody types anything. It works for 30 minutes.</p>
  ${SH.qr?`<div class="qrbox" style="background:#fff;padding:8px;border-radius:12px;max-width:260px;margin:8px auto">${SH.qr.svg||""}</div><p style="text-align:center;font-size:20px;letter-spacing:3px;margin:4px 0"><b>${esc(SH.qr.token)}</b></p>`:""}
  <button class="${SH.qr?"ghost":""}" data-a="shmyqr" ${SH.qrBusy||!d.sharing_on?"disabled":""}>${SH.qrBusy?"Please wait…":SH.qr?"New QR":"Show my QR"}</button></div>
  <div class="card"><h2>Shared so far</h2>${hist?`<div class="q">${hist}</div>`:`<p class="mute">Nothing shared yet.</p>`}</div>`}
async function shGive(){
  const bid=SH.f.bid.toUpperCase().replace(/[^A-Z0-9]/g,""),mb=parseInt(SH.f.mb,10);
  SH.pick=null;
  if(!SH.to&&bid.length!==8){SH.msg="Enter your friend's 8-character Booking ID, or scan their QR.";SH.ok=false;return render()}
  if(!(mb>=1)){SH.msg=SHMSG.BAD_AMOUNT;SH.ok=false;return render()}
  if(SH.to)return shSend({mb,who:SH.to.name||"your friend"});
  const pk=await db.rpc("space_booking_peek",{p_to_code:bid});
  if(pk.error||!pk.data){SH.msg="Could not check that Booking ID. Check your internet and try again.";SH.ok=false;return render()}
  if(!pk.data.ok){SH.msg=shSay(pk.data.error,pk.data);SH.ok=false;return render()}
  const ppl=pk.data.people||[];
  if(ppl.length>1){SH.pick={bid,mb,people:ppl};SH.msg="";return render()}   /* several people on this booking: ask who */
  return shSend({mb,bid,person:ppl[0]&&ppl[0].id,who:(ppl[0]&&ppl[0].name)||"your friend"})}
async function shSend(o){
  const mb=o.mb;
  if(!confirm(`Give ${mb} MB of ${SH.kind} space to ${o.who}?`))return;
  SH.busy=true;SH.msg="";SH.pick=null;render();
  const r=SH.to?await db.rpc("space_give_token",{p_code:S.code,p_phone:S.phone,p_token:SH.to.token,p_kind:SH.kind,p_mb:mb}):await db.rpc("space_give_booking",{p_code:S.code,p_phone:S.phone,p_to_code:o.bid,p_kind:SH.kind,p_mb:mb,p_to_person:o.person||null});
  SH.busy=false;
  if(r.error||!r.data){SH.msg="Could not share. Check your internet and try again.";SH.ok=false;return render()}
  if(!r.data.ok){SH.msg=shSay(r.data.error,r.data);SH.ok=false;return render()}
  SH.msg=`Done. ${mb} MB of ${SH.kind} space was given to ${o.who}.`;SH.ok=true;SH.f.mb="";
  await Promise.all([refreshStatus(),vStatus()]);SH.loaded=false;SH.fail=false;render()}
async function shReturn(id){
  if(!confirm("Take this space back from your friend?"))return;
  const r=await db.rpc("space_return",{p_code:S.code,p_phone:S.phone,p_id:id});
  if(r.error||!r.data){SH.msg="Could not take it back. Try again.";SH.ok=false;return render()}
  if(!r.data.ok){SH.msg=shSay(r.data.error,r.data);SH.ok=false;return render()}
  SH.msg="Space taken back.";SH.ok=true;await Promise.all([refreshStatus(),vStatus()]);SH.loaded=false;SH.fail=false;render()}

/* ---------- events ---------- */
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="v1"||t.id==="v2"){const f=t.files&&t.files[0];t.value="";if(f)uploadOneVideo(f);return}
  if(t.id==="f1"||t.id==="f2"){const fs=Array.from(t.files);t.value="";if(fs.length)addFiles(fs);return}
  if(t.dataset&&t.dataset.tick){const it=S.sel.find(x=>x.id===t.dataset.tick);if(it){it.on=t.checked;updateCap()}}});
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.fb){const s=document.createElement("span");s.className="nop";s.textContent=t.alt||"Preview not available";t.replaceWith(s)}},true);
document.addEventListener("keydown",e=>{
  if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&(S.lb!=null||SV.lb!=null)){const b=document.querySelector(".lb .nav."+(e.key==="ArrowLeft"?"l":"r"));if(b)b.click();return}if(e.key==="Escape"&&(S.lb!=null||SV.lb!=null)){S.lb=null;SV.lb=null;render()}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="sbid")SH.f.bid=t.value;else if(t.id==="smb")SH.f.mb=t.value});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a],[data-lt],[data-id],[data-tab],[data-mode],[data-open],[data-retry],[data-rm],[data-dl],[data-del],[data-vopen],[data-vdl],[data-vdel],[data-sk],[data-sret],[data-spick]");if(!t)return;
  const d=t.dataset;
  if(d.vopen!=null){SV.lb=+d.vopen;render();const q=SV.items[SV.lb];if(q)loadSharpV(q.id);return}
  if(d.vdl){const w=window.open("","_blank");const r=await P.call(await cfg(),{action:"vview",id:d.vdl});
    if(r.ok){if(w)w.location=r.url;else location.href=r.url}else{if(w)w.close();SV.note="Could not open the original. Try again.";SV.lb=null;render()}return}
  if(d.vdel){if(!confirm("Delete this video? It is removed from storage and cannot be recovered."))return;
    const body={action:"vremove",id:d.vdel};if(S.role==="pub"){body.code=S.code;body.phone=S.phone}
    const r=await P.call(await cfg(),body);
    if(r.ok){SV.items=SV.items.filter(p=>p.id!==d.vdel);SV.lb=null;await vStatus();SV.note="Video deleted."}else SV.note="Could not delete that video.";
    return render()}
  if(d.lt){S.loginTab=d.lt;S.msg="";return render()}
  if(d.id){const b=$("#bid");if(b)b.value=d.id;S.prefill=d.id;return}
  if(d.tab){if(d.tab!=="share")scanStop();S.tab=d.tab;S.note="";S.loadFail=false;if(d.tab==="upload"&&S.role==="pub")await refreshStatus();if(d.tab==="share"){SH.loaded=false;SH.fail=false;SH.msg=""}return render()}
  if(d.sk){SH.kind=d.sk;SH.msg="";return render()}
  if(d.sret){return shReturn(d.sret)}
  if(d.spick!=null){const k=SH.pick;if(!k)return;const q=k.people.find(x=>x.id===d.spick);if(!q)return;return shSend({mb:k.mb,bid:k.bid,person:q.id,who:q.name||"your friend"})}
  if(d.mode){S.mode=d.mode;LSset("gal_mode",d.mode);S.note="";return render()}
  if(d.open!=null){S.lb=+d.open;render();const q=S.photos[S.lb];if(q)loadSharp(q.id);return}
  if(d.retry){const it=S.q.find(x=>x.id===d.retry);if(it){it.state="wait";it.err="";pump();draw()}return}
  if(d.rm){const i=S.q.findIndex(x=>x.id===d.rm);if(i>=0){idbDel(S.q[i].id);S.q.splice(i,1);draw()}return}
  if(d.dl){const w=window.open("","_blank");const r=await P.call(await cfg(),{action:"view",id:d.dl});
    if(r.ok){if(w)w.location=r.url;else location.href=r.url}else{if(w)w.close();S.note="Could not open the original. Try again.";S.lb=null;render()}return}
  if(d.del){if(!confirm("Delete this photo? It is removed from storage and cannot be recovered."))return;
    const body={action:"remove",id:d.del};if(S.role==="pub"){body.code=S.code;body.phone=S.phone}
    const r=await P.call(await cfg(),body);
    if(r.ok){S.photos=S.photos.filter(p=>p.id!==d.del);S.lb=null;await refreshStatus();S.note="Photo deleted."}else S.note="Could not delete that photo.";
    return render()}
  switch(d.a){
    case"out":return signOut();
    case"noop":return;
    case"lbclose":S.lb=null;return render();
    case"lbprev":case"lbnext":{const n=S.lb+(d.a==="lbnext"?1:-1);if(n<0||n>=S.photos.length)return;S.lb=n;render();loadSharp(S.photos[n].id);return}
    case"vlbprev":case"vlbnext":{const n=SV.lb+(d.a==="vlbnext"?1:-1);if(n<0||n>=SV.items.length)return;SV.lb=n;render();loadSharpV(SV.items[n].id);return}
    case"vlbclose":SV.lb=null;return render();
    case"shrefresh":SH.loaded=false;SH.fail=false;SH.msg="";return loadShare();
    case"sgive":return shGive();
    case"shmyqr":return shMyQR();
    case"shscan":return shScan();
    case"shscanstop":scanStop();return render();
    case"shclear":SH.to=null;SH.msg="";return render();
    case"shpickno":SH.pick=null;return render();
    case"vrefresh":SV.loaded=false;SV.fail=false;SV.note="";await vStatus();return loadVideos(true);
    case"vmore":SV.fail=false;return loadVideos(false);
    case"all":S.sel.forEach(i=>{if(!i.bad)i.on=true});return render();
    case"none":S.sel.forEach(i=>{i.on=false});return render();
    case"fit":{let left=leftBytes();S.sel.forEach(i=>{if(i.bad){i.on=false;return}if(i.size<=left){i.on=true;left-=i.size}else i.on=false});return render()}
    case"cancelsel":{const keep=S.sel.filter(i=>i.state==="draft");S.sel.forEach(dropUrl);S.sel=[];S.drafts=S.drafts.concat(keep);return render()}
    case"upsel":{const go=selOn(),rest=S.sel.filter(i=>!go.includes(i));
      S.drafts=S.drafts.concat(rest.filter(i=>i.state==="draft"));rest.filter(i=>i.state!=="draft").forEach(dropUrl);S.sel=[];
      await queueItems(go);return render()}
    case"draftpick":await refreshStatus();S.sel=S.sel.concat(S.drafts);S.drafts=[];return render();
    case"draftall":{await refreshStatus();const go=S.drafts;S.drafts=[];await queueItems(go);return render()}
    case"draftdel":if(!confirm("Delete all "+S.drafts.length+" drafts from this phone?"))return;for(const i of S.drafts)await idbDel(i.id);S.drafts=[];return render();
    case"clrdone":S.q=S.q.filter(i=>i.state!=="done");return render();
    case"refresh":S.loaded=false;S.loadFail=false;S.note="";return loadPhotos(true);
    case"more":S.loadFail=false;return loadPhotos(false);
  }
});
/* swipe left or right in the viewer to move to the next or previous picture */
let sx=null;
document.addEventListener("touchstart",e=>{sx=e.target.closest&&e.target.closest(".lb")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<60)return;const b=document.querySelector(".lb .nav."+(dx>0?"l":"r"));if(b)b.click()},{passive:true});
boot();
